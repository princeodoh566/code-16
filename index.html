<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planer Explorer | Code 16</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-theme="light">
    <!-- HEADER -->

    <!-- MAIN -->
        <main>
            <section aria-labelledby="search-heading">
                <h2 id="search-heading" class="sr-only">Search planets</h2>
                <form id="search-form" role="search" novalidate>
                    <div class="search-input-wrapper">
                        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <label for="planet-search" class="sr-only">Search planet name</label>
                        <input
                            type="search"
                            id="planet-search"
                            name="planetQuery"
                            placeholder="Search planet name..."
                            autocomplete="off"
                            aria-describedby="search-message"
                        />
                        <p id="search-message" role="status" aria-live="polite"></p>
                        <button type="submit">Search</button>
                    </div>
                </form>
            </section>
        </main>

    <!-- FOOTER -->

    <script src="./js/script.js"></script>
  </body>
</html>
