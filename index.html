<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Explore planets in the solar system using live planet data." />
        <title>Planet Explorer | Code 16</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;
        800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body data-theme="light">

        <!-- ===== HEADER: Adeola (2.2) ===== -->
                <header>
            <nav class="nav-container">
                <a
                href="./assets/logo_black.svg"
                class="logo-link"
                aria-label="Planet Explorer Home"
                >
                </a>
            <svg
                class="decor-svg"
                aria-hidden="true"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://w3.org"
                >
            <circle
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="2"
                />
            </svg>


            <button
            type="button"
            class="theme-toggle"
            aria-label="Toggle dark theme"
            aria-pressed="false"
        >
            <span class="theme-text">DARK</span>
            <span class="theme-icon" aria-hidden="true">
                <img src="./assets/Theme_Icon.svg" alt="" width="24" height="24" />
            </span>
            </nav>
        </button>
      
    </header>


        <main id="top" class="page-container">

        <!-- ===== SEARCH: Fuhad (2.3) ===== -->
<section aria-labelledby="search-heading">
  <h2 id="search-heading" class="sr-only">Search planets</h2>
  <form id="search-form" role="search" novalidate>
    <div class="search-input-wrapper">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <label for="planet-search" class="sr-only">
        Search planet name
      </label>
      <input
        type="search"
        id="planet-search"
        name="planetQuery"
        placeholder="Search planet name..."
        autocomplete="off"
        aria-describedby="search-message"
      >
      <p id="search-message" role="status" aria-live="polite"></p>
      <button type="submit">Search</button>
    </div>
  </form>
</section>

        <!-- ===== PLANET CARD, LOADING, ERROR: Christiana (2.4, 2.5) ===== -->
            <section class="planet-section" aria-label="Planet information">
              <div id="loading-state" class="status-message" aria-live="polite">Loading planet data…</div>
<div id="error-state" class="status-message error-box is-hidden" role="alert">
  <p>We could not load the planet data. Please check your internet connection and try again.</p>
  <button id="retry-button" type="button">Try again</button>
</div>
  <article id="planet-card" class="planet-card is-hidden"></article>
</section>


        <!-- ===== TABLE: Skipper (2.6) ===== -->

        </main>


        <!-- ===== FOOTER: Blessing (2.7) ===== -->


        <script src="js/script.js"></script>
    </body>
</html>
