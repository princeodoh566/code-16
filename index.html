<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Information</title>
</head>
<body>
  <main>
    <section class="planet-section">
      <article id="planet-card" class="planet-card is-hidden">
        <div class="planet-card-image">
          <img id="planet-image" src="" alt="Planet image">
        </div>
        <div class="planet-card-info">
          <p class="planet-type" id="planet-type"></p>
          <h1 id="planet-name"></h1>
          <p class="planet-description" id="planet-description"></p>
          <div class="planet-primary"></div>
          <div class="planet-extra"></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
